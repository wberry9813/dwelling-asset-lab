name: Build Phase 01A Mother Assets

on:
  push:
    branches: [main]
    paths:
      - "blender/**"
      - "scenes/review_vignette/**"
      - "assets/manifests/**"
      - "tools/validate_asset_manifests.py"
      - ".github/workflows/build-phase-01a.yml"
  pull_request:
    paths:
      - "blender/**"
      - "scenes/review_vignette/**"
      - "assets/manifests/**"
      - "tools/validate_asset_manifests.py"
      - ".github/workflows/build-phase-01a.yml"
  workflow_dispatch:
    inputs:
      review_mode:
        description: Review render quality
        required: true
        default: hero
        type: choice
        options:
          - fast
          - hero

concurrency:
  group: phase-01a-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-mother-assets:
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "5.2.2"
      BLENDER_DIR: "blender-5.2.2-linux-x64"
      DWELLING_REVIEW_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.review_mode || 'fast' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate asset manifests
        run: python3 tools/validate_asset_manifests.py

      - name: Install headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-6 libxext6 libxrender1 libxi6 libxfixes3 libxkbcommon0

      - name: Restore Blender cache
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BLENDER_DIR }}
          key: blender-linux-x64-${{ env.BLENDER_VERSION }}

      - name: Download Blender 5.2 LTS
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          curl -L --fail --retry 3             "https://download.blender.org/release/Blender5.2/blender-${BLENDER_VERSION}-linux-x64.tar.xz"             -o blender.tar.xz
          tar -xf blender.tar.xz

      - name: Add Blender to PATH
        run: echo "$PWD/${BLENDER_DIR}" >> "$GITHUB_PATH"

      - name: Build assets and review renders
        run: |
          set -o pipefail
          blender --background --python-exit-code 1 --python scenes/review_vignette/build.py
          test -s build/phase_01a/sofa-001.blend
          test -s build/phase_01a/sofa-001.glb
          test -s build/phase_01a/bed-001.blend
          test -s build/phase_01a/bed-001.glb
          test -s build/phase_01a/preview-sofa-001-3q.png
          test -s build/phase_01a/preview-bed-001-3q.png
          if [ "$DWELLING_REVIEW_MODE" = "hero" ]; then
            test -s build/phase_01a/preview-sofa-001-side.png
            test -s build/phase_01a/preview-bed-001-side.png
          fi
          test -s build/phase_01a/lighting-preset-warm-daylight.json
          test -s build/phase_01a/validation.json

      - name: Show validation report
        run: cat build/phase_01a/validation.json

      - name: Upload Phase 01A review package
        uses: actions/upload-artifact@v4
        with:
          name: phase-01a-mother-assets-${{ github.sha }}
          path: build/phase_01a/
          retention-days: 7
          if-no-files-found: error
