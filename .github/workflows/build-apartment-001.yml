name: Build Apartment 001

on:
  push:
    branches: [main]
    paths:
      - "scenes/apartment_001/**"
      - ".github/workflows/build-apartment-001.yml"
  pull_request:
    paths:
      - "scenes/apartment_001/**"
      - ".github/workflows/build-apartment-001.yml"
  workflow_dispatch:

concurrency:
  group: apartment-001-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  blender-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install headless rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libx11-6 libxext6 libxrender1 libxi6 libxfixes3 libxkbcommon0

      - name: Download Blender
        run: |
          BLENDER_VERSION=4.3.2
          curl -L --fail --retry 3             "https://download.blender.org/release/Blender4.3/blender-${BLENDER_VERSION}-linux-x64.tar.xz"             -o blender.tar.xz
          tar -xf blender.tar.xz
          echo "$PWD/blender-${BLENDER_VERSION}-linux-x64" >> "$GITHUB_PATH"

      - name: Build, validate and render
        run: |
          set -o pipefail
          blender --background --python-exit-code 1 --python scenes/apartment_001/build.py
          test -s build/dwelling-apartment-001.blend
          test -s build/dwelling-apartment-001.glb
          test -s build/preview-isometric.png
          test -s build/preview-top.png
          test -s build/preview-living.png
          test -s build/validation.json

      - name: Show validation report
        run: cat build/validation.json

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: apartment-001-${{ github.sha }}
          path: build/
          retention-days: 7
          if-no-files-found: error
